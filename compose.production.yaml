# Application host behind the TLS edge proxy (nginx/beta.pk-db.com).
#   PKDB_BUILD_COMMIT="$(git rev-parse HEAD)" \
#     docker compose -f compose.yaml -f compose.production.yaml up --build --wait
# nginx serves the frontend on PKDB_WEB_PORT and forwards backend routes; the
# backend itself is no longer published on the host.
services:
  backend:
    environment:
      PKDB_BROWSER_ORIGIN: ${PKDB_BROWSER_ORIGIN:-https://beta.pk-db.com}
      PKDB_SECURE_COOKIES: "true"
      # Only the web service reaches the backend; trust its client address.
      FORWARDED_ALLOW_IPS: "*"
    ports: !reset []

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile-production
      target: web
      args:
        PKDB_BUILD_COMMIT: ${PKDB_BUILD_COMMIT:-}
    volumes:
      - ./nginx/pkdb.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${PKDB_WEB_PORT:-18083}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1/health/ready]
      interval: 3s
      timeout: 5s
      retries: 30
    restart: unless-stopped
