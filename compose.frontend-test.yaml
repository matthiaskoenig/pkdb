name: pkdb-frontend-test
services:
  db:
    image: postgres:18.6
    environment:
      POSTGRES_DB: pkdb_frontend_test
      POSTGRES_USER: pkdb_frontend_test
      POSTGRES_PASSWORD: frontend-test-only
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U pkdb_frontend_test -d pkdb_frontend_test']
      interval: 2s
      timeout: 5s
      retries: 30
  backend:
    build: ./backend
    environment:
      PKDB_DATABASE_URL: postgresql+psycopg://pkdb_frontend_test:frontend-test-only@db/pkdb_frontend_test
      PKDB_FILE_ROOT: /data/files
      PKDB_BROWSER_ORIGIN: http://127.0.0.1:18184
      PKDB_RATE_LIMITS_ENABLED: 'false'
      PYTHONPATH: /app
      PKDB_FRONTEND_FIXTURE: 'isolated-test-only'
    volumes:
      - ./tools/frontend_testing:/app/frontend_testing:ro
      - ./backend/tests/fixtures/frontend_search.py:/app/frontend_search.py:ro
    command: [python, /app/frontend_testing/serve.py]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 10s
    depends_on:
      db:
        condition: service_healthy
    tmpfs:
      - /data/files:uid=10001,gid=10001
  web:
    image: nginx:1.29.1-alpine@sha256:42a516af16b852e33b7682d5ef8acbd5d13fe08fecadc7ed98605ba5e3b26ab8
    ports:
      - '127.0.0.1:18184:80'
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./frontend/tests/deployment/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1/health/ready]
      interval: 2s
      timeout: 5s
      retries: 30
