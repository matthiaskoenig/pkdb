name: pkdb-current

services:
  db:
    image: postgres:18.6
    environment:
      POSTGRES_DB: pkdb
      POSTGRES_USER: pkdb
      POSTGRES_PASSWORD: ${PKDB_POSTGRES_PASSWORD:-local-development-only}
    volumes:
      - database:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pkdb -d pkdb"]
      interval: 2s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  backend:
    image: pkdb-local:latest
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        PYTHON_VERSION: ${PKDB_PYTHON_VERSION:-3.14}
    environment:
      PKDB_DATABASE_URL: postgresql+psycopg://pkdb:${PKDB_POSTGRES_PASSWORD:-local-development-only}@db:5432/pkdb
      PKDB_FILE_ROOT: /data/files
      PKDB_CORS_ORIGINS: ${PKDB_CORS_ORIGINS:-[]}
      PKDB_BROWSER_ORIGIN: ${PKDB_BROWSER_ORIGIN:-http://localhost:8080}
      PKDB_SECURE_COOKIES: ${PKDB_SECURE_COOKIES:-false}
      PKDB_QUOTA_ANONYMOUS_PER_MINUTE: ${PKDB_QUOTA_ANONYMOUS_PER_MINUTE:-120}
      PKDB_QUOTA_IP_PER_MINUTE: ${PKDB_QUOTA_IP_PER_MINUTE:-600}
      PKDB_SMTP_HOST: ${PKDB_SMTP_HOST:-}
      PKDB_SMTP_SENDER: ${PKDB_SMTP_SENDER:-}
      PKDB_SMTP_PORT: ${PKDB_SMTP_PORT:-587}
      PKDB_SMTP_USERNAME: ${PKDB_SMTP_USERNAME:-}
      PKDB_SMTP_PASSWORD: ${PKDB_SMTP_PASSWORD:-}
      PKDB_SMTP_STARTTLS: ${PKDB_SMTP_STARTTLS:-true}
    volumes:
      - attachments:/data/files
      - ./frontend/public/assets/images/avatars:/app/frontend/public/assets/images/avatars:ro
    ports:
      - "127.0.0.1:${PKDB_HTTP_PORT:-18083}:8000"
    depends_on:
      db:
        condition: service_healthy
    command:
      - sh
      - -c
      - >-
        alembic upgrade head &&
        pkdb-server bootstrap /app/bootstrap &&
        exec uvicorn pkdb_server.app:create_app --factory --host 0.0.0.0 --port 8000 --no-access-log
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 10s
    restart: unless-stopped

  frontend:
    profiles: [dev]
    build:
      context: ./frontend
      dockerfile: Dockerfile-develop
    environment:
      PKDB_DEV_API_TARGET: http://backend:8000
      PKDB_DEV_USE_POLLING: ${PKDB_DEV_USE_POLLING:-true}
      PKDB_BUILD_COMMIT: ${PKDB_BUILD_COMMIT:-}
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./frontend/src:/app/src:ro
      - ./frontend/public:/app/public:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 10s

volumes:
  database:
  attachments:
