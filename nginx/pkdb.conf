# PK-DB application host: serves the built frontend and forwards backend routes.
# Used by compose.production.yaml behind the TLS edge proxy (nginx/beta.pk-db.com)
# and by compose.frontend-test.yaml for the browser tests.

# Keep https from the edge proxy; direct requests use their own scheme.
map $http_x_forwarded_proto $pkdb_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    include /etc/nginx/mime.types;

    # Restore the client address sent by the edge proxy on the local network.
    set_real_ip_from 192.168.0.0/24;
    real_ip_header X-Forwarded-For;

    client_max_body_size 100m;
    proxy_connect_timeout 900;
    proxy_send_timeout    900;
    proxy_read_timeout    900;
    send_timeout          900;

    location ~ ^/(api(?:/|$)|accounts(?:/|$)|media(?:/|$)|health(?:/|$)|static(?:/|$)|mcp(?:/|$)|api-token-auth(?:/|$)|docs(?:/|$)|redoc(?:/|$)|openapi\.json$) {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $pkdb_forwarded_proto;
        # A single trusted client address for the backend's per-IP quotas.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_buffering off;
    }
    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location ~* \.(?:js|css|map|png|jpg|jpeg|svg|ico|woff2?)$ {
        try_files $uri =404;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
