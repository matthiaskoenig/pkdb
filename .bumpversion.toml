[tool.bumpversion]
current_version = "0.10.2"
commit = true
parse = "(?P<major>\\d+)\\.(?P<minor>\\d+)\\.(?P<patch>\\d+)"
serialize = ["{major}.{minor}.{patch}"]
search = "{current_version}"
replace = "{new_version}"
regex = false
ignore_missing_version = false
# no tag: the bump is merged into develop through a pull request, which
# rewrites the commit, so the tag is created on develop afterwards
tag = false
sign_tags = false
tag_name = "{new_version}"
tag_message = "Bump version: {current_version} → {new_version}"
allow_dirty = false
message = "Bump version: {current_version} → {new_version}"
commit_args = ""

[[tool.bumpversion.files]]
filename = "./backend/src/pkdb/__init__.py"

[[tool.bumpversion.files]]
filename = "./backend/pyproject.toml"

[[tool.bumpversion.files]]
filename = "./backend/uv.lock"
search = """name = "pkdb"\nversion = "{current_version}""""
replace = """name = "pkdb"\nversion = "{new_version}""""

[[tool.bumpversion.files]]
filename = "./frontend/package.json"
search = '"version": "{current_version}"'
replace = '"version": "{new_version}"'

[[tool.bumpversion.files]]
filename = "./frontend/package-lock.json"
search = '"name": "pkdb-frontend",(?P<spacing>\s*)"version": "{current_version}"'
replace = '"name": "pkdb-frontend",\g<spacing>"version": "{new_version}"'
regex = true

[[tool.bumpversion.files]]
filename = "./CITATION.cff"
search = 'version: "{current_version}"'
replace = 'version: "{new_version}"'
