[project]
site_name = "PK-DB"
site_description = "PK-DB - the open pharmacokinetics database"
site_url = "https://matthiaskoenig.github.io/pkdb/"
site_author = "Matthias König"

copyright = 'Copyright &copy; 2017-2026 Matthias König · <a href="https://livermetabolism.com">Systems Medicine of the Liver</a> · <a href="mailto:koenigmx@hu-berlin.de">koenigmx@hu-berlin.de</a> · <a href="https://github.com/matthiaskoenig/pkdb/issues/new">Report an issue</a> · <a href="https://matthiaskoenig.github.io/pkdb/terms-of-use/">Terms of use</a>'

repo_url = "https://github.com/matthiaskoenig/pkdb"
repo_name = "matthiaskoenig/pkdb"
edit_uri = "edit/develop/docs/"

extra_css = ["stylesheets/extra.css"]

nav = [
  { "Introduction" = "index.md" },
  { "Webinterface" = "web-interface.md" },
  { "Example study" = "example-study.md" },
  { "Local curation" = "local-curation.md" },
  { "API" = [
    { "Accounts and API keys" = "authentication.md" },
    { "REST API" = "api.md" },
    { "API examples" = "api-examples.md" },
    { "MCP for agents" = "mcp.md" },
    { "Python client" = "python-client.md" },
  ] },
  { "Citation" = "citation.md" },
  { "Terms of use" = "terms-of-use.md" },
  { "Development" = [
    { "Overview and source installation" = "development.md" },
    { "Internal data model" = "data-model.md" },
    { "Local setup and development server" = "installation.md" },
    { "Local upload testing" = "local-upload-testing.md" },
    { "Account administration" = "administration.md" },
    { "Vocabulary definitions" = "vocabulary.md" },
    { "Deployment" = "deployment.md" },
  ] },
]

[project.theme]
language = "en"
logo = "pkdb_logo.png"
favicon = "pkdb_logo.png"
features = [
  "content.action.edit",
  "content.code.annotate",
  "content.code.copy",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "search.suggest",
  "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "blue"
accent = "blue"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "blue"
accent = "blue"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/matthiaskoenig/pkdb"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
pymdownx.superfences = {}
pymdownx.tabbed.alternate_style = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}
