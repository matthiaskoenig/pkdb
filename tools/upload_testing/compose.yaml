services:
  db:
    image: postgres:18.6
    environment:
      POSTGRES_DB: pkdb_upload_test
      POSTGRES_USER: pkdb_upload_test
      POSTGRES_PASSWORD: disposable-upload-test
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, pg_isready -U pkdb_upload_test -d pkdb_upload_test]
      interval: 2s
      timeout: 5s
      retries: 30
  backend:
    build:
      context: ../..
      dockerfile: backend/Dockerfile
    environment:
      PKDB_DATABASE_URL: postgresql+psycopg://pkdb_upload_test:disposable-upload-test@db/pkdb_upload_test
      PKDB_FILE_ROOT: /data/files
      PKDB_RATE_LIMITS_ENABLED: 'false'
      PYTHONPATH: /source/python:/source/backend
    volumes:
      - ../../python/src:/source/python:ro
      - ../../backend/src:/source/backend:ro
      - .:/app/upload_testing:ro
      - ../../frontend/public:/app/frontend/public:ro
      - ${PKDB_UPLOAD_CORPUS:?Set PKDB_UPLOAD_CORPUS to the apixaban directory}:/studies:ro
    command: [sh, -c, 'alembic upgrade head && pkdb-server bootstrap /app/bootstrap && exec uvicorn pkdb_server.app:create_app --factory --host 0.0.0.0 --port 8000 --no-access-log']
    depends_on:
      db:
        condition: service_healthy
    tmpfs:
      - /data/files:uid=10001,gid=10001
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 2s
      timeout: 5s
      retries: 60
      start_period: 10s
