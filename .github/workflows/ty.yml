name: ty

on:
  push:
    # feature branches are checked through their pull request
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ty:
    # required by the branch protection, see .github/rulesets/develop.json
    name: ty
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install uv and set the python version
        uses: astral-sh/setup-uv@v10.3.1
        with:
          python-version: "3.14"
          enable-cache: true
          cache-python: true
      - name: Install the backend
        working-directory: backend
        run: uv sync --locked --python 3.14
      - name: Type check
        working-directory: backend
        env:
          # render diagnostics as GitHub Actions workflow annotations
          TY_OUTPUT_FORMAT: github
        run: uv run --locked --python 3.14 ty check
      # the client runs on Linux, Windows and macOS, so its types are checked for each
      - name: Install the client
        working-directory: python
        run: uv sync --locked --python 3.14 --all-extras
      - name: Type check the client
        working-directory: python
        env:
          TY_OUTPUT_FORMAT: github
        # every platform is checked, and the step fails at the end if any failed
        run: |
          status=0
          for platform in linux win32 darwin; do
            echo "ty check for $platform"
            uv run --locked --python 3.14 ty check --python-version 3.14 --python-platform "$platform" || status=1
          done
          exit "$status"
