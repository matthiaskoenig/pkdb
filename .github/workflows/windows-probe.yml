# Temporary: find the failing and hanging client tests on Windows. Removed before merge.
name: windows-probe
on:
  push:
    branches: [fix/windows-client-tests]
permissions:
  contents: read
jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: python
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.14"
          enable-cache: true
      - run: uv sync --python 3.14 --locked --all-extras
      - run: uv run --python 3.14 --locked --all-extras pytest -v --tb=short -rfE -p no:cacheprovider -o faulthandler_timeout=240 --deselect "tests/test_curation_rows.py::test_a_same_size_edit_with_a_preserved_mtime_reads_the_format_again"
