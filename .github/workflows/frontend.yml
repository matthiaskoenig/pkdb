name: Frontend
on:
  workflow_call:
permissions:
  contents: read
concurrency:
  # a called workflow sees the name of its caller in `github.workflow`, the
  # group of the caller would deadlock it, so it has a group of its own
  group: frontend-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm install --global npm@12.1.0
      - run: test "$(node --version)" = v24.21.0 && test "$(npm --version)" = 12.1.0
      - run: npm ci
      - run: npm run test:source
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:unit -- --run
      - run: npm run build
      - name: Cache the Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}
      - name: Install the Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps
      - name: Install the system dependencies of the cached browsers
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: frontend-browser-failures
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
      - uses: actions/upload-artifact@v7
        with:
          name: frontend-static
          path: frontend/dist
          retention-days: 14
