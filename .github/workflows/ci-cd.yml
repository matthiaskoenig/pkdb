name: CI-CD
on:
  push:
    branches: [develop, main]
    tags: ['v*']
  pull_request:
    branches: [develop, main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ['3.14']
    services:
      postgres:
        image: postgres:18.0
        env:
          POSTGRES_DB: pkdb_test
          POSTGRES_USER: pkdb_test
          POSTGRES_PASSWORD: local-test-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U pkdb_test -d pkdb_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      PKDB_TEST_DATABASE_URL: postgresql+psycopg://pkdb_test:local-test-only@localhost:5432/pkdb_test
      PKDB_DATABASE_URL: postgresql+psycopg://pkdb_test:local-test-only@localhost:5432/pkdb_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --locked --python ${{ matrix.python }}
      - run: uv run --python ${{ matrix.python }} --locked alembic upgrade head
      - run: uv run --python ${{ matrix.python }} --locked alembic check
      - run: uv run --python ${{ matrix.python }} --locked alembic downgrade base
      - run: uv run --python ${{ matrix.python }} --locked alembic upgrade head
      - name: Verify generated vocabulary matches authoring sources
        run: uv run --python ${{ matrix.python }} --locked python ../scripts/update_vocabulary.py --check
      - run: uv run --python ${{ matrix.python }} --locked pytest -q
      - run: uv run --python ${{ matrix.python }} --locked ruff check .
      - run: uv run --python ${{ matrix.python }} --locked ruff format --check .
      - run: uv run --python ${{ matrix.python }} --locked ty check
      - run: uv build --python ${{ matrix.python }}
      - name: Install wheel in clean environment
        run: |
          uv venv --python ${{ matrix.python }} /tmp/pkdb-wheel
          uv pip install --python /tmp/pkdb-wheel/bin/python dist/*.whl
          cd /tmp
          /tmp/pkdb-wheel/bin/python -c 'import pkdb, numpy, scipy, pandas, pint; from pkdb_analysis.pk import pharmacokinetics'
      - name: Build pinned runtime image
        run: docker build --build-arg PYTHON_VERSION=${{ matrix.python }} -t pkdb:py${{ matrix.python }} .
      - name: Verify installed container runtime
        env:
          PKDB_TEST_IMAGE: pkdb:py${{ matrix.python }}
          PKDB_TEST_IMAGE_PYTHON: ${{ matrix.python }}
        run: uv run --python ${{ matrix.python }} --locked pytest system_tests/test_runtime.py -q
      - name: Verify rebuild accounting tooling
        run: |
          cd ..
          PYTHONPATH=. backend/.venv/bin/python -m pytest tools/backend_migration -q
      - name: Verify PostgreSQL and attachment restore
        env:
          PKDB_TEST_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: uv run --python ${{ matrix.python }} --locked pytest system_tests/test_restore.py -q

  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: pkdb-ci
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Start the documented local stack
        run: docker compose up --build --wait --wait-timeout 180
      - name: Verify automatic schema and vocabulary bootstrap
        run: |
          curl --fail http://127.0.0.1:18083/health/ready
          curl --fail 'http://127.0.0.1:18083/api/v1/info_nodes/?page_size=1'
          printf '%s\n' 'Local-CI-password-42!' | docker compose exec -T backend pkdb create-admin ci-operator --email ci@example.org --password-stdin
          docker compose restart backend
          docker compose up -d --wait --wait-timeout 180
          python - <<'PYTHON'
          import json
          import urllib.request
          request = urllib.request.Request(
              "http://127.0.0.1:18083/api-token-auth/",
              data=json.dumps({"username": "ci-operator", "password": "Local-CI-password-42!"}).encode(),
              headers={"Content-Type": "application/json"},
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              assert json.load(response)["token"]
          PYTHON
      - name: Show logs on failure
        if: failure()
        run: docker compose logs --tail 100
      - name: Remove disposable CI stack
        if: always()
        run: docker compose down -v

  tests:
    name: tests
    needs: [python, compose]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require Python 3.14 and local Docker setup
        env:
          PYTHON_RESULT: ${{ needs.python.result }}
          COMPOSE_RESULT: ${{ needs.compose.result }}
        run: |
          test "$PYTHON_RESULT" = success
          test "$COMPOSE_RESULT" = success

  release:
    # the backend is not published on PyPI, a release is the tag with its
    # GitHub release
    needs: tests
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write  # create the GitHub release
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
        # only the release notes are needed
        filter: blob:none
        sparse-checkout: |
          release-notes
    - name: Determine the release notes path
      # the tag v0.10.0 releases with release-notes/0.10.0.md
      run: echo "NOTES_PATH=release-notes/${GITHUB_REF_NAME#v}.md" >> "$GITHUB_ENV"
    - name: Create GitHub release
      uses: softprops/action-gh-release@v3
      with:
        body_path: ${{ env.NOTES_PATH }}
        draft: false
        prerelease: false

  sync-main:
    # main tracks the latest release, see docs/development.md
    needs: release
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write  # fast-forward main to the released commit
    steps:
    - name: Fast-forward main to the release
      # via the api, so the repository is not cloned; without force the update
      # fails loudly if it would not be a fast-forward. The first release
      # creates the branch.
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        if gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --silent 2>/dev/null; then
          gh api -X PATCH "repos/${GITHUB_REPOSITORY}/git/refs/heads/main" \
            -f sha="${GITHUB_SHA}" -F force=false --silent
        else
          gh api -X POST "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f ref="refs/heads/main" -f sha="${GITHUB_SHA}" --silent
        fi
