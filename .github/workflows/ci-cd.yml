name: CI-CD
on:
  push:
    branches: [develop, main]
    tags: ['v*']
  pull_request:
    branches: [develop, main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # a newer run supersedes the running one of the same branch or pull request;
  # a release is never superseded, every tag is a group of its own
  cancel-in-progress: true
env:
  # The jobs server, compose and frontend-e2e each build the backend image from the
  # layer cache that server writes, with this Python. server and frontend-e2e start it
  # under this tag (compose under pkdb-local:latest, the name in compose.yaml); the id
  # of the run in the tag makes sure that they never start an older image.
  PKDB_IMAGE_PYTHON: "3.14"
  PKDB_BACKEND_IMAGE: pkdb-ci-backend:run-${{ github.run_id }}
jobs:
  changes:
    # A pull request of documentation only skips the test jobs, see scripts/ci_changes.py;
    # every push, release tag and manual run, and anything the script cannot tell,
    # count as code.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # the merge commit of a pull request and its first parent, the base branch
          fetch-depth: 2
      - name: Decide whether code changed
        id: classify
        env:
          EVENT: ${{ github.event_name }}
        run: python3 scripts/ci_changes.py --event "$EVENT" --ref "$GITHUB_REF" --output "$GITHUB_OUTPUT"

  python:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # continuous integration tests the newest python, python 3.15 is tested
        # locally before a pull request is opened, see docs/development.md
        python: ["3.14"]
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: pkdb_test
          POSTGRES_USER: pkdb_test
          POSTGRES_PASSWORD: local-test-only
        ports: ['5432:5432']
        # the disposable test database keeps its data in memory, as compose.test.yaml does
        options: >-
          --tmpfs /var/lib/postgresql
          --health-cmd "pg_isready -U pkdb_test -d pkdb_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      PKDB_TEST_DATABASE_URL: postgresql+psycopg://pkdb_test:local-test-only@localhost:5432/pkdb_test
      PKDB_DATABASE_URL: postgresql+psycopg://pkdb_test:local-test-only@localhost:5432/pkdb_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Run the test database without durable writes
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: ../scripts/ci_postgres_without_fsync.sh "$POSTGRES_CONTAINER"
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ matrix.python }}
          # a release run restores no cache, which zizmor cannot tell from the
          # expression; the released distributions are built without one
          enable-cache: ${{ !startsWith(github.ref, 'refs/tags/') }}  # zizmor: ignore[cache-poisoning]
          # the interpreter is cached with the packages instead of downloaded by every run
          cache-python: ${{ !startsWith(github.ref, 'refs/tags/') }}  # zizmor: ignore[cache-poisoning]
          # every job has its own cache, or one job's packages win over the others'
          cache-suffix: ${{ github.job }}
      - run: uv sync --locked --python ${{ matrix.python }}
      - run: uv run --python ${{ matrix.python }} --locked alembic upgrade head
      - run: uv run --python ${{ matrix.python }} --locked alembic check
      - run: uv run --python ${{ matrix.python }} --locked alembic downgrade base
      - run: uv run --python ${{ matrix.python }} --locked alembic upgrade head
      - name: Verify generated vocabulary matches authoring sources
        run: uv run --python ${{ matrix.python }} --locked python ../scripts/update_vocabulary.py --check
      - name: Verify bundled client vocabulary matches server reference data
        run: uv run --python ${{ matrix.python }} --locked python ../scripts/update_client_vocabulary.py --check
      - name: Verify bundled curator profiles match the curator roster
        run: uv run --python ${{ matrix.python }} --locked python ../scripts/update_client_curators.py --check
      # every test owns a copy of a template database that each worker migrates once,
      # see tests/db_fixtures.py, so the tests run in parallel; an idle worker
      # takes tests from a busy one
      - run: uv run --python ${{ matrix.python }} --locked pytest -q -n auto --dist worksteal --durations=15
      - name: Verify rebuild accounting tooling
        run: |
          cd ..
          PYTHONPATH=. backend/.venv/bin/python -m pytest tools/backend_migration -q

  server:
    # The backend image, whose layers only this job caches, so that no two jobs race
    # to write them; the server wheel; the system tests of the image: the installed
    # container runtime and the restore of PostgreSQL and the attachments.
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: pkdb_test
          POSTGRES_USER: pkdb_test
          POSTGRES_PASSWORD: local-test-only
        ports: ['5432:5432']
        options: >-
          --tmpfs /var/lib/postgresql
          --health-cmd "pg_isready -U pkdb_test -d pkdb_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      PKDB_TEST_DATABASE_URL: postgresql+psycopg://pkdb_test:local-test-only@localhost:5432/pkdb_test
      PKDB_DATABASE_URL: postgresql+psycopg://pkdb_test:local-test-only@localhost:5432/pkdb_test
    defaults:
      run:
        working-directory: backend
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Run the test database without durable writes
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: ../scripts/ci_postgres_without_fsync.sh "$POSTGRES_CONTAINER"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
      - name: Build the backend image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: backend/Dockerfile
          build-args: PYTHON_VERSION=${{ env.PKDB_IMAGE_PYTHON }}
          tags: ${{ env.PKDB_BACKEND_IMAGE }}
          load: true
          provenance: false
          # the layers are cached between runs; a release run builds without the
          # cache, which zizmor cannot tell from the expression
          cache-from: ${{ !startsWith(github.ref, 'refs/tags/') && 'type=gha,scope=backend' || '' }}  # zizmor: ignore[cache-poisoning]
          cache-to: ${{ !startsWith(github.ref, 'refs/tags/') && 'type=gha,scope=backend,mode=max,ignore-error=true' || '' }}  # zizmor: ignore[cache-poisoning]
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ env.PKDB_IMAGE_PYTHON }}
          # a release run restores no cache, which zizmor cannot tell from the
          # expression; the released distributions are built without one
          enable-cache: ${{ !startsWith(github.ref, 'refs/tags/') }}  # zizmor: ignore[cache-poisoning]
          # every job has its own cache, or one job's packages win over the others'
          cache-suffix: ${{ github.job }}
          cache-python: ${{ !startsWith(github.ref, 'refs/tags/') }}  # zizmor: ignore[cache-poisoning]
      - run: uv sync --locked --python "$PKDB_IMAGE_PYTHON"
      - run: uv build --python "$PKDB_IMAGE_PYTHON"
      - name: Install wheel in clean environment
        env:
          # The server environment does not ship the curation app; the client job builds it.
          PKDB_BUILD_WITHOUT_CURATION_APP: '1'
        run: |
          uv venv --python "$PKDB_IMAGE_PYTHON" /tmp/pkdb-wheel
          # Kept apart from dist/, so no pkdb wheel without the app sits next to release files.
          uv build --python "$PKDB_IMAGE_PYTHON" --project ../python --out-dir "$RUNNER_TEMP/pkdb-dist"
          uv pip install --python /tmp/pkdb-wheel/bin/python dist/*.whl "$RUNNER_TEMP"/pkdb-dist/*.whl
          cd /tmp
          /tmp/pkdb-wheel/bin/python -c 'import pkdb, pkdb_server, numpy, scipy, pandas, pint; from pkpdutils import Timecourse, nca_single'
      - uses: actions/upload-artifact@v7
        with:
          name: server-distributions
          path: backend/dist/pkdb_server-*
      - name: Verify installed container runtime
        env:
          PKDB_TEST_IMAGE: ${{ env.PKDB_BACKEND_IMAGE }}
          PKDB_TEST_IMAGE_PYTHON: ${{ env.PKDB_IMAGE_PYTHON }}
        run: uv run --python "$PKDB_IMAGE_PYTHON" --locked pytest system_tests/test_runtime.py -q
      - name: Verify PostgreSQL and attachment restore
        env:
          PKDB_TEST_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: uv run --python "$PKDB_IMAGE_PYTHON" --locked pytest system_tests/test_restore.py -q

  compose:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: pkdb-ci
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
      - name: Build the backend image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: backend/Dockerfile
          build-args: PYTHON_VERSION=${{ env.PKDB_IMAGE_PYTHON }}
          # the name in compose.yaml, so that compose starts this image
          tags: pkdb-local:latest
          load: true
          provenance: false
          # the layers that the job server caches; a release run builds without the
          # cache, which zizmor cannot tell from the expression
          cache-from: ${{ !startsWith(github.ref, 'refs/tags/') && 'type=gha,scope=backend' || '' }}  # zizmor: ignore[cache-poisoning]
      - name: Start the documented local stack
        # the image built above, so compose builds nothing
        run: docker compose up --no-build --wait --wait-timeout 180
      - name: Verify automatic schema and vocabulary bootstrap
        run: |
          curl --fail http://127.0.0.1:18083/health/ready
          curl --fail 'http://127.0.0.1:18083/api/v1/info_nodes/?page_size=1'
          printf '%s\n' 'Local-CI-password-42!' | docker compose exec -T backend pkdb-server create-admin mkoenig --email ci@example.org --password-stdin
          docker compose restart backend
          docker compose up -d --no-build --wait --wait-timeout 180
          python - <<'PYTHON'
          import http.cookiejar
          import json
          import urllib.error
          import urllib.request

          base = "http://127.0.0.1:18083"
          browser = urllib.request.build_opener(
              urllib.request.HTTPCookieProcessor(http.cookiejar.CookieJar())
          )
          with browser.open(base + "/api/v1/auth/csrf", timeout=30) as response:
              csrf = json.load(response)["csrf_token"]
          request = urllib.request.Request(
              base + "/api/v1/auth/login",
              data=json.dumps({"username": "mkoenig", "password": "Local-CI-password-42!"}).encode(),
              headers={
                  "Content-Type": "application/json",
                  "Origin": "http://localhost:8080",
                  "X-CSRF-Token": csrf,
              },
          )
          with browser.open(request, timeout=30) as response:
              account = json.load(response)
              assert account == {"username": "mkoenig", "role": "admin"}
              assert "HttpOnly" in response.headers["Set-Cookie"]
          with browser.open(base + "/api/v1/me", timeout=30) as response:
              profile = json.load(response)
              assert profile["role"] == "admin"
              assert "mfa_required" not in profile
          for path, expected in (("/api/v1/admin/users", 200), ("/api-token-auth/", 404)):
              request = urllib.request.Request(base + path)
              if path == "/api-token-auth/":
                  request.data = json.dumps({"username": "mkoenig", "password": "Local-CI-password-42!"}).encode()
                  request.add_header("Content-Type", "application/json")
                  request.add_header("Origin", "http://localhost:8080")
                  request.add_header("X-CSRF-Token", csrf)
              try:
                  with browser.open(request, timeout=30) as response:
                      assert response.status == expected, (path, response.status)
              except urllib.error.HTTPError as error:
                  assert error.code == expected, (path, error.code)
          PYTHON
      - name: Show logs on failure
        if: failure()
        run: docker compose logs --tail 100
      - name: Remove disposable CI stack
        if: always()
        run: docker compose down -v

  client:
    name: Client (${{ matrix.os }}, Python ${{ matrix.python }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # macOS and Windows are tested for release tag pushes and manual runs,
        # so a branch can be tested on every platform before it is tagged.
        os: ${{ fromJSON((github.event_name == 'workflow_dispatch' || github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) && '["ubuntu-latest", "macos-latest", "windows-latest"]' || '["ubuntu-latest"]') }}
        # continuous integration tests the newest python, python 3.15 is tested
        # locally before a pull request is opened, see docs/development.md
        python: ["3.14"]
    defaults:
      run:
        working-directory: python
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ matrix.python }}
          # a release run restores no cache, which zizmor cannot tell from the
          # expression; the released distributions are built without one
          enable-cache: ${{ !startsWith(github.ref, 'refs/tags/') }}  # zizmor: ignore[cache-poisoning]
          # the interpreter is cached with the packages instead of downloaded by every run
          cache-python: ${{ !startsWith(github.ref, 'refs/tags/') }}  # zizmor: ignore[cache-poisoning]
          # every job has its own cache, or one job's packages win over the others'
          cache-suffix: ${{ github.job }}
      - run: uv sync --python ${{ matrix.python }} --locked --all-extras
      # The workbook round trip tests re-save workbooks with LibreOffice. Its packages
      # are cached per image of the runner, so a run installs them without downloading.
      # A run that has to download them saves them as the newest packages of that image,
      # so packages that no longer install are replaced.
      - name: Name the image of the runner
        id: runner-image
        if: runner.os == 'Linux'
        run: echo "name=$ImageOS-$ImageVersion" >> "$GITHUB_OUTPUT"
      - name: Restore the LibreOffice Calc packages
        # a release run restores no cache and downloads the packages, which zizmor
        # cannot tell from the condition
        if: runner.os == 'Linux' && !startsWith(github.ref, 'refs/tags/')
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0  # zizmor: ignore[cache-poisoning]
        with:
          path: ~/libreoffice-packages
          key: libreoffice-calc-${{ steps.runner-image.outputs.name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: libreoffice-calc-${{ steps.runner-image.outputs.name }}-
      - name: Install LibreOffice Calc
        id: libreoffice
        if: runner.os == 'Linux'
        run: |
          packages="$HOME/libreoffice-packages"
          # nothing reads manual pages here, so their index is not rebuilt
          sudo rm -f /var/lib/man-db/auto-update
          if compgen -G "$packages/*.deb" > /dev/null \
            && sudo apt-get install -y --no-install-recommends "$packages"/*.deb; then
            exit 0
          fi
          # no packages, or packages that no longer install: download them anew
          rm -rf "$packages"
          sudo apt-get update
          sudo apt-get clean
          sudo apt-get install -y --no-install-recommends --download-only libreoffice-calc
          mkdir -p "$packages"
          cp /var/cache/apt/archives/*.deb "$packages"/
          sudo apt-get install -y --no-install-recommends libreoffice-calc
          echo "downloaded=true" >> "$GITHUB_OUTPUT"
      - name: Save the LibreOffice Calc packages
        # a release run saves no cache, which zizmor cannot tell from the condition
        if: steps.libreoffice.outputs.downloaded == 'true' && !startsWith(github.ref, 'refs/tags/')
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0  # zizmor: ignore[cache-poisoning]
        with:
          path: ~/libreoffice-packages
          key: libreoffice-calc-${{ steps.runner-image.outputs.name }}-${{ github.run_id }}-${{ github.run_attempt }}
      # The speed tests (-m slow) run in client-slow, see addopts in pyproject.toml.
      - run: uv run --python ${{ matrix.python }} --locked --all-extras pytest -q -n auto --durations=15
        env:
          # On Linux a missing LibreOffice fails the round trip tests; macOS and Windows skip them.
          PKDB_REQUIRE_LIBREOFFICE: ${{ runner.os == 'Linux' && '1' || '' }}
      # The wheel ships the curation app, which is built from frontend/.
      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
          # the curation app built here ships in the released wheel, so a
          # release run restores no cache, which zizmor cannot tell from the expression
          cache: ${{ !startsWith(github.ref, 'refs/tags/') && 'npm' || '' }}  # zizmor: ignore[cache-poisoning]
          cache-dependency-path: frontend/package-lock.json
      - run: npm install --global npm@12.1.0
      - run: test "$(node --version)" = v24.21.0 && test "$(npm --version)" = 12.1.0
      - run: npm ci
        working-directory: frontend
      - run: npm run build:curation
        working-directory: frontend
      - run: uv build --python ${{ matrix.python }}
      - name: Verify isolated public wheel, sdist and CLI
        run: |
          uv venv --python ${{ matrix.python }} wheel-env
          if [ "$RUNNER_OS" = Windows ]; then
            PYTHON_BIN=wheel-env/Scripts/python.exe
            PKDB_BIN=wheel-env/Scripts/pkdb.exe
          else
            PYTHON_BIN=wheel-env/bin/python
            PKDB_BIN=wheel-env/bin/pkdb
          fi
          uv pip install --python "$PYTHON_BIN" dist/*.whl
          "$PYTHON_BIN" -c 'import pkdb, importlib.util; from pkdb.domain.validation import prepare_study; from pkdb.cache import bundled_vocabulary; assert bundled_vocabulary().substances; assert importlib.util.find_spec("pkdb_server") is None; assert importlib.util.find_spec("sqlalchemy") is None'
          "$PYTHON_BIN" -c "import importlib.resources as r; assert (r.files('pkdb.curation') / 'static' / 'index.html').is_file()"
          # The sdist ships the app too: a stray PKDB_BUILD_WITHOUT_CURATION_APP would leave it out.
          "$PYTHON_BIN" -c "import glob, tarfile; names = tarfile.open(*glob.glob('dist/pkdb-*.tar.gz')).getnames(); assert any(name.endswith('/src/pkdb/curation/static/index.html') for name in names), 'The sdist lacks the curation app'"
          "$PKDB_BIN" --help
      - uses: actions/upload-artifact@v7
        if: runner.os == 'Linux'
        with:
          name: python-distributions
          path: python/dist/*

  client-slow:
    # The speed tests measure CPU time; they run in one process, without
    # workers that share the cores, and on every platform that client tests.
    name: Client speed tests (${{ matrix.os }}, Python ${{ matrix.python }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((github.event_name == 'workflow_dispatch' || github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) && '["ubuntu-latest", "macos-latest", "windows-latest"]' || '["ubuntu-latest"]') }}
        python: ["3.14"]
    defaults:
      run:
        working-directory: python
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ matrix.python }}
          # a release run restores no cache, which zizmor cannot tell from the expression
          enable-cache: ${{ !startsWith(github.ref, 'refs/tags/') }}  # zizmor: ignore[cache-poisoning]
          # every job has its own cache, or one job's packages win over the others'
          cache-suffix: ${{ github.job }}
          cache-python: ${{ !startsWith(github.ref, 'refs/tags/') }}  # zizmor: ignore[cache-poisoning]
      - run: uv sync --python ${{ matrix.python }} --locked --all-extras
      - run: uv run --python ${{ matrix.python }} --locked --all-extras pytest -q -m slow --durations=5

  curation-e2e:
    # The curation app in Chromium against the real `pkdb curate`, which the specs
    # start with the Python of the uv environment on copies of tools/curation_testing/fixture.
    name: Curation app browser tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.14"
          # a release run restores no cache, which zizmor cannot tell from the expression
          enable-cache: ${{ !startsWith(github.ref, 'refs/tags/') }}  # zizmor: ignore[cache-poisoning]
          # every job has its own cache, or one job's packages win over the others'
          cache-suffix: ${{ github.job }}
          cache-python: ${{ !startsWith(github.ref, 'refs/tags/') }}  # zizmor: ignore[cache-poisoning]
      - run: uv sync --project ../python --locked --python 3.14
      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
          # a release run restores no cache, which zizmor cannot tell from the expression
          cache: ${{ !startsWith(github.ref, 'refs/tags/') && 'npm' || '' }}  # zizmor: ignore[cache-poisoning]
          cache-dependency-path: frontend/package-lock.json
      - run: npm install --global npm@12.1.0
      - run: test "$(node --version)" = v24.21.0 && test "$(npm --version)" = 12.1.0
      - run: npm ci
      - run: npm run build:curation
      - name: Read the Playwright version
        id: playwright
        run: echo "version=$(node -p 'require("./package-lock.json").packages["node_modules/playwright"].version')" >> "$GITHUB_OUTPUT"
      - name: Cache Chromium
        id: browser-cache
        # a release run restores no cache and downloads Chromium, which zizmor
        # cannot tell from the condition
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0  # zizmor: ignore[cache-poisoning]
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium
      - name: Install Chromium
        if: steps.browser-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install the system dependencies of the cached Chromium
        if: steps.browser-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - run: npm run test:curation-e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: curation-browser-failures
          path: |
            frontend/playwright-report/curation
            frontend/test-results/curation
          retention-days: 7

  frontend-unit:
    name: Frontend checks
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
          # a release run restores no cache, which zizmor cannot tell from the expression
          cache: ${{ !startsWith(github.ref, 'refs/tags/') && 'npm' || '' }}  # zizmor: ignore[cache-poisoning]
          cache-dependency-path: frontend/package-lock.json
      - run: npm install --global npm@12.1.0
      - run: test "$(node --version)" = v24.21.0 && test "$(npm --version)" = 12.1.0
      - run: npm ci
      - run: npm run test:source
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:unit -- --run
      - run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: frontend-static
          path: frontend/dist
          retention-days: 14

  frontend-e2e:
    # Every browser in a job of its own, against a disposable stack of the backend
    # image of the run, see tools/frontend_testing/run.sh.
    name: Frontend browser tests (${{ matrix.browser }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    defaults:
      run:
        working-directory: frontend
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
          # a release run restores no cache, which zizmor cannot tell from the expression
          cache: ${{ !startsWith(github.ref, 'refs/tags/') && 'npm' || '' }}  # zizmor: ignore[cache-poisoning]
          cache-dependency-path: frontend/package-lock.json
      - run: npm install --global npm@12.1.0
      - run: test "$(node --version)" = v24.21.0 && test "$(npm --version)" = 12.1.0
      - run: npm ci
      - run: npm run build
      - name: Read the Playwright version
        id: playwright
        run: echo "version=$(node -p 'require("./package-lock.json").packages["node_modules/playwright"].version')" >> "$GITHUB_OUTPUT"
      - name: Cache the browser
        id: browser-cache
        # a release run restores no cache and downloads the browser, which zizmor
        # cannot tell from the condition
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0  # zizmor: ignore[cache-poisoning]
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-${{ matrix.browser }}
      - name: Install the browser
        if: steps.browser-cache.outputs.cache-hit != 'true'
        env:
          BROWSER: ${{ matrix.browser }}
        run: npx playwright install --with-deps "$BROWSER"
      - name: Install the system dependencies of the cached browser
        if: steps.browser-cache.outputs.cache-hit == 'true'
        env:
          BROWSER: ${{ matrix.browser }}
        run: npx playwright install-deps "$BROWSER"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
      - name: Build the backend image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: backend/Dockerfile
          build-args: PYTHON_VERSION=${{ env.PKDB_IMAGE_PYTHON }}
          tags: ${{ env.PKDB_BACKEND_IMAGE }}
          load: true
          provenance: false
          # the layers that the job server caches; a release run builds without the
          # cache, which zizmor cannot tell from the expression
          cache-from: ${{ !startsWith(github.ref, 'refs/tags/') && 'type=gha,scope=backend' || '' }}  # zizmor: ignore[cache-poisoning]
      - name: Test the frontend in the browser
        env:
          BROWSER: ${{ matrix.browser }}
          # the image built above, which the harness starts instead of building one
          PKDB_TEST_IMAGE: ${{ env.PKDB_BACKEND_IMAGE }}
        run: npm run test:e2e -- --project="$BROWSER"
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: frontend-browser-failures-${{ matrix.browser }}
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7

  tests:
    # the one required check of this workflow, see .github/rulesets/develop.json
    name: tests
    needs: [changes, python, server, compose, client, client-slow, curation-e2e, frontend-unit, frontend-e2e]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every test job, or none for a change of documentation only
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
          NEEDS: ${{ toJSON(needs) }}
        run: |
          test "$CHANGES_RESULT" = success
          case "$CODE" in
            true) expected=success ;;
            false) expected=skipped ;;
            *) echo "the job changes told neither code=true nor code=false" >&2; exit 1 ;;
          esac
          echo "$NEEDS" | jq -r 'del(.changes) | to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e --arg expected "$expected" \
            'del(.changes) | [.[].result] | all(. == $expected)' > /dev/null

  publish-pypi:
    name: Publish public Python package
    needs: tests
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/pkdb/
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: python-distributions
          path: dist
      - name: Verify public distributions match the release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PYTHON'
          import os
          from pathlib import Path
          version = os.environ["RELEASE_TAG"].removeprefix("v")
          expected = {f"pkdb-{version}.tar.gz", f"pkdb-{version}-py3-none-any.whl"}
          actual = {path.name for path in Path("dist").iterdir()}
          assert actual == expected, (actual, expected)
          PYTHON
      - name: Publish to PyPI with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1

  release:
    # Matching client and server distributions are attached to the tagged release.
    needs: [tests, publish-pypi]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write  # create the GitHub release
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
        # only the release notes are needed
        filter: blob:none
        sparse-checkout: |
          release-notes
    - name: Determine the release notes path
      # the tag v0.10.0 releases with release-notes/0.10.0.md
      run: echo "NOTES_PATH=release-notes/${GITHUB_REF_NAME#v}.md" >> "$GITHUB_ENV"
    - uses: actions/download-artifact@v8
      with:
        pattern: "*-distributions"
        merge-multiple: true
        path: dist
    - name: Create GitHub release
      uses: softprops/action-gh-release@v3
      with:
        body_path: ${{ env.NOTES_PATH }}
        files: dist/*
        draft: false
        prerelease: false

  sync-main:
    # main tracks the latest release, see docs/development.md
    needs: release
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write  # fast-forward main to the released commit
    steps:
    - name: Fast-forward main to the release
      # via the api, so the repository is not cloned; without force the update
      # fails loudly if it would not be a fast-forward. The first release
      # creates the branch.
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        if gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --silent 2>/dev/null; then
          gh api -X PATCH "repos/${GITHUB_REPOSITORY}/git/refs/heads/main" \
            -f sha="${GITHUB_SHA}" -F force=false --silent
        else
          gh api -X POST "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f ref="refs/heads/main" -f sha="${GITHUB_SHA}" --silent
        fi
