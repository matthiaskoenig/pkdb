name: CI-CD
on:
  push:
    branches: [develop, main]
    tags: ['v*']
  pull_request:
    branches: [develop, main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # a newer run supersedes the running one of the same branch or pull request;
  # a release is never superseded, every tag is a group of its own
  cancel-in-progress: true
jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # continuous integration tests the newest python, python 3.15 is tested
        # locally before a pull request is opened, see docs/development.md
        python: ["3.14"]
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: pkdb_test
          POSTGRES_USER: pkdb_test
          POSTGRES_PASSWORD: local-test-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U pkdb_test -d pkdb_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      PKDB_TEST_DATABASE_URL: postgresql+psycopg://pkdb_test:local-test-only@localhost:5432/pkdb_test
      PKDB_DATABASE_URL: postgresql+psycopg://pkdb_test:local-test-only@localhost:5432/pkdb_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ matrix.python }}
          # a release run restores no cache, which zizmor cannot tell from the
          # expression; the released distributions are built without one
          enable-cache: ${{ !startsWith(github.ref, 'refs/tags/') }}  # zizmor: ignore[cache-poisoning]
          # the interpreter is cached with the packages instead of downloaded by every run
          cache-python: ${{ !startsWith(github.ref, 'refs/tags/') }}  # zizmor: ignore[cache-poisoning]
      - run: uv sync --locked --python ${{ matrix.python }}
      - run: uv run --python ${{ matrix.python }} --locked alembic upgrade head
      - run: uv run --python ${{ matrix.python }} --locked alembic check
      - run: uv run --python ${{ matrix.python }} --locked alembic downgrade base
      - run: uv run --python ${{ matrix.python }} --locked alembic upgrade head
      - name: Verify generated vocabulary matches authoring sources
        run: uv run --python ${{ matrix.python }} --locked python ../scripts/update_vocabulary.py --check
      - name: Verify bundled client vocabulary matches server reference data
        run: uv run --python ${{ matrix.python }} --locked python ../scripts/update_client_vocabulary.py --check
      - name: Verify bundled curator profiles match the curator roster
        run: uv run --python ${{ matrix.python }} --locked python ../scripts/update_client_curators.py --check
      # every test owns a database schema, so the tests run in parallel; a test file
      # stays on one worker, which builds its module fixtures only once
      - run: uv run --python ${{ matrix.python }} --locked pytest -q -n auto --dist loadfile --durations=15
      - run: uv run --python ${{ matrix.python }} --locked ruff check .
      - run: uv run --python ${{ matrix.python }} --locked ruff format --check .
      - run: uv run --python ${{ matrix.python }} --locked ty check --python-version ${{ matrix.python }}
      - run: uv build --python ${{ matrix.python }}
      - name: Install wheel in clean environment
        env:
          # The server environment does not ship the curation app; the client job builds it.
          PKDB_BUILD_WITHOUT_CURATION_APP: '1'
        run: |
          uv venv --python ${{ matrix.python }} /tmp/pkdb-wheel
          # Kept apart from dist/, so no pkdb wheel without the app sits next to release files.
          uv build --python ${{ matrix.python }} --project ../python --out-dir "$RUNNER_TEMP/pkdb-dist"
          uv pip install --python /tmp/pkdb-wheel/bin/python dist/*.whl "$RUNNER_TEMP"/pkdb-dist/*.whl
          cd /tmp
          /tmp/pkdb-wheel/bin/python -c 'import pkdb, pkdb_server, numpy, scipy, pandas, pint; from pkpdutils import Timecourse, nca_single'
      - uses: actions/upload-artifact@v7
        with:
          name: server-distributions
          path: backend/dist/pkdb_server-*
      - name: Build pinned runtime image
        run: docker build --build-arg PYTHON_VERSION=${{ matrix.python }} -t pkdb:py${{ matrix.python }} -f Dockerfile ..
      - name: Verify installed container runtime
        env:
          PKDB_TEST_IMAGE: pkdb:py${{ matrix.python }}
          PKDB_TEST_IMAGE_PYTHON: ${{ matrix.python }}
        run: uv run --python ${{ matrix.python }} --locked pytest system_tests/test_runtime.py -q
      - name: Verify rebuild accounting tooling
        run: |
          cd ..
          PYTHONPATH=. backend/.venv/bin/python -m pytest tools/backend_migration -q
      - name: Verify PostgreSQL and attachment restore
        env:
          PKDB_TEST_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: uv run --python ${{ matrix.python }} --locked pytest system_tests/test_restore.py -q

  client:
    name: Client (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # macOS and Windows are tested for release tag pushes and manual runs,
        # so a branch can be tested on every platform before it is tagged.
        os: ${{ fromJSON((github.event_name == 'workflow_dispatch' || github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) && '["ubuntu-latest", "macos-latest", "windows-latest"]' || '["ubuntu-latest"]') }}
        # continuous integration tests the newest python, python 3.15 is tested
        # locally before a pull request is opened, see docs/development.md
        python: ["3.14"]
    defaults:
      run:
        working-directory: python
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ matrix.python }}
          # a release run restores no cache, which zizmor cannot tell from the
          # expression; the released distributions are built without one
          enable-cache: ${{ !startsWith(github.ref, 'refs/tags/') }}  # zizmor: ignore[cache-poisoning]
          # the interpreter is cached with the packages instead of downloaded by every run
          cache-python: ${{ !startsWith(github.ref, 'refs/tags/') }}  # zizmor: ignore[cache-poisoning]
      - run: uv sync --python ${{ matrix.python }} --locked --all-extras
      # The workbook round trip tests re-save workbooks with LibreOffice.
      - name: Install LibreOffice Calc
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libreoffice-calc
      - run: uv run --python ${{ matrix.python }} --locked --all-extras pytest -q -n auto --durations=15
        env:
          # On Linux a missing LibreOffice fails the round trip tests; macOS and Windows skip them.
          PKDB_REQUIRE_LIBREOFFICE: ${{ runner.os == 'Linux' && '1' || '' }}
      - run: uv run --python ${{ matrix.python }} --locked ruff check .
      - run: uv run --python ${{ matrix.python }} --locked ruff format --check .
      - run: uv run --python ${{ matrix.python }} --locked ty check --python-version ${{ matrix.python }}
      # The wheel ships the curation app, which is built from frontend/.
      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
          # the curation app built here ships in the released wheel, so a
          # release run restores no cache, which zizmor cannot tell from the expression
          cache: ${{ !startsWith(github.ref, 'refs/tags/') && 'npm' || '' }}  # zizmor: ignore[cache-poisoning]
          cache-dependency-path: frontend/package-lock.json
      - run: npm install --global npm@12.1.0
      - run: test "$(node --version)" = v24.21.0 && test "$(npm --version)" = 12.1.0
      - run: npm ci
        working-directory: frontend
      - run: npm run build:curation
        working-directory: frontend
      # The curation app end to end in Chromium against the real `pkdb curate`, which the specs
      # start with the Python of the uv environment on copies of tools/curation_testing/fixture.
      - name: Cache Chromium for the curation app tests
        id: chromium-cache
        # a release run restores no cache and downloads Chromium, which zizmor
        # cannot tell from the condition
        if: runner.os == 'Linux' && !startsWith(github.ref, 'refs/tags/')
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0  # zizmor: ignore[cache-poisoning]
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}
      - name: Install Chromium for the curation app tests
        if: runner.os == 'Linux' && steps.chromium-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Install the system dependencies of the cached Chromium
        if: runner.os == 'Linux' && steps.chromium-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
        working-directory: frontend
      - name: Test the curation app end to end
        if: runner.os == 'Linux'
        run: npm run test:curation-e2e
        working-directory: frontend
      - uses: actions/upload-artifact@v7
        if: failure() && runner.os == 'Linux'
        with:
          name: curation-browser-failures
          path: |
            frontend/playwright-report/curation
            frontend/test-results/curation
          retention-days: 7
      - run: uv build --python ${{ matrix.python }}
      - name: Verify isolated public wheel, sdist and CLI
        run: |
          uv venv --python ${{ matrix.python }} wheel-env
          if [ "$RUNNER_OS" = Windows ]; then
            PYTHON_BIN=wheel-env/Scripts/python.exe
            PKDB_BIN=wheel-env/Scripts/pkdb.exe
          else
            PYTHON_BIN=wheel-env/bin/python
            PKDB_BIN=wheel-env/bin/pkdb
          fi
          uv pip install --python "$PYTHON_BIN" dist/*.whl
          "$PYTHON_BIN" -c 'import pkdb, importlib.util; from pkdb.domain.validation import prepare_study; from pkdb.cache import bundled_vocabulary; assert bundled_vocabulary().substances; assert importlib.util.find_spec("pkdb_server") is None; assert importlib.util.find_spec("sqlalchemy") is None'
          "$PYTHON_BIN" -c "import importlib.resources as r; assert (r.files('pkdb.curation') / 'static' / 'index.html').is_file()"
          # The sdist ships the app too: a stray PKDB_BUILD_WITHOUT_CURATION_APP would leave it out.
          "$PYTHON_BIN" -c "import glob, tarfile; names = tarfile.open(*glob.glob('dist/pkdb-*.tar.gz')).getnames(); assert any(name.endswith('/src/pkdb/curation/static/index.html') for name in names), 'The sdist lacks the curation app'"
          "$PKDB_BIN" --help
      - uses: actions/upload-artifact@v7
        if: runner.os == 'Linux'
        with:
          name: python-distributions
          path: python/dist/*

  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: pkdb-ci
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Start the documented local stack
        run: docker compose up --build --wait --wait-timeout 180
      - name: Verify automatic schema and vocabulary bootstrap
        run: |
          curl --fail http://127.0.0.1:18083/health/ready
          curl --fail 'http://127.0.0.1:18083/api/v1/info_nodes/?page_size=1'
          printf '%s\n' 'Local-CI-password-42!' | docker compose exec -T backend pkdb-server create-admin mkoenig --email ci@example.org --password-stdin
          docker compose restart backend
          docker compose up -d --wait --wait-timeout 180
          python - <<'PYTHON'
          import http.cookiejar
          import json
          import urllib.error
          import urllib.request

          base = "http://127.0.0.1:18083"
          browser = urllib.request.build_opener(
              urllib.request.HTTPCookieProcessor(http.cookiejar.CookieJar())
          )
          with browser.open(base + "/api/v1/auth/csrf", timeout=30) as response:
              csrf = json.load(response)["csrf_token"]
          request = urllib.request.Request(
              base + "/api/v1/auth/login",
              data=json.dumps({"username": "mkoenig", "password": "Local-CI-password-42!"}).encode(),
              headers={
                  "Content-Type": "application/json",
                  "Origin": "http://localhost:8080",
                  "X-CSRF-Token": csrf,
              },
          )
          with browser.open(request, timeout=30) as response:
              account = json.load(response)
              assert account == {"username": "mkoenig", "role": "admin"}
              assert "HttpOnly" in response.headers["Set-Cookie"]
          with browser.open(base + "/api/v1/me", timeout=30) as response:
              profile = json.load(response)
              assert profile["role"] == "admin"
              assert "mfa_required" not in profile
          for path, expected in (("/api/v1/admin/users", 200), ("/api-token-auth/", 404)):
              request = urllib.request.Request(base + path)
              if path == "/api-token-auth/":
                  request.data = json.dumps({"username": "mkoenig", "password": "Local-CI-password-42!"}).encode()
                  request.add_header("Content-Type", "application/json")
                  request.add_header("Origin", "http://localhost:8080")
                  request.add_header("X-CSRF-Token", csrf)
              try:
                  with browser.open(request, timeout=30) as response:
                      assert response.status == expected, (path, response.status)
              except urllib.error.HTTPError as error:
                  assert error.code == expected, (path, error.code)
          PYTHON
      - name: Show logs on failure
        if: failure()
        run: docker compose logs --tail 100
      - name: Remove disposable CI stack
        if: always()
        run: docker compose down -v

  frontend:
    uses: ./.github/workflows/frontend.yml

  tests:
    name: tests
    needs: [python, client, compose, frontend]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require backend, frontend, and local Docker setup
        env:
          PYTHON_RESULT: ${{ needs.python.result }}
          CLIENT_RESULT: ${{ needs.client.result }}
          COMPOSE_RESULT: ${{ needs.compose.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
        run: |
          test "$PYTHON_RESULT" = success
          test "$CLIENT_RESULT" = success
          test "$COMPOSE_RESULT" = success
          test "$FRONTEND_RESULT" = success

  publish-pypi:
    name: Publish public Python package
    needs: tests
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/pkdb/
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: python-distributions
          path: dist
      - name: Verify public distributions match the release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PYTHON'
          import os
          from pathlib import Path
          version = os.environ["RELEASE_TAG"].removeprefix("v")
          expected = {f"pkdb-{version}.tar.gz", f"pkdb-{version}-py3-none-any.whl"}
          actual = {path.name for path in Path("dist").iterdir()}
          assert actual == expected, (actual, expected)
          PYTHON
      - name: Publish to PyPI with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1

  release:
    # Matching client and server distributions are attached to the tagged release.
    needs: [tests, publish-pypi]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write  # create the GitHub release
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
        # only the release notes are needed
        filter: blob:none
        sparse-checkout: |
          release-notes
    - name: Determine the release notes path
      # the tag v0.10.0 releases with release-notes/0.10.0.md
      run: echo "NOTES_PATH=release-notes/${GITHUB_REF_NAME#v}.md" >> "$GITHUB_ENV"
    - uses: actions/download-artifact@v8
      with:
        pattern: "*-distributions"
        merge-multiple: true
        path: dist
    - name: Create GitHub release
      uses: softprops/action-gh-release@v3
      with:
        body_path: ${{ env.NOTES_PATH }}
        files: dist/*
        draft: false
        prerelease: false

  sync-main:
    # main tracks the latest release, see docs/development.md
    needs: release
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write  # fast-forward main to the released commit
    steps:
    - name: Fast-forward main to the release
      # via the api, so the repository is not cloned; without force the update
      # fails loudly if it would not be a fast-forward. The first release
      # creates the branch.
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        if gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --silent 2>/dev/null; then
          gh api -X PATCH "repos/${GITHUB_REPOSITORY}/git/refs/heads/main" \
            -f sha="${GITHUB_SHA}" -F force=false --silent
        else
          gh api -X POST "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f ref="refs/heads/main" -f sha="${GITHUB_SHA}" --silent
        fi
