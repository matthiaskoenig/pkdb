name: Backend replacement
on:
  pull_request:
    paths: ['backend-next/**', 'tools/backend_migration/**', '.github/workflows/backend-next.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.13', '3.14']
    services:
      postgres:
        image: postgres:18.0
        env:
          POSTGRES_DB: pkdb_test
          POSTGRES_USER: pkdb_test
          POSTGRES_PASSWORD: local-test-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U pkdb_test -d pkdb_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      PKDB_TEST_DATABASE_URL: postgresql+psycopg://pkdb_test:local-test-only@localhost:5432/pkdb_test
      PKDB_DATABASE_URL: postgresql+psycopg://pkdb_test:local-test-only@localhost:5432/pkdb_test
    defaults:
      run:
        working-directory: backend-next
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --locked --python ${{ matrix.python }}
      - run: uv run --python ${{ matrix.python }} --locked alembic upgrade head
      - run: uv run --python ${{ matrix.python }} --locked alembic check
      - run: uv run --python ${{ matrix.python }} --locked alembic downgrade base
      - run: uv run --python ${{ matrix.python }} --locked alembic upgrade head
      - run: uv run --python ${{ matrix.python }} --locked pytest -q
      - run: uv run --python ${{ matrix.python }} --locked ruff check .
      - run: uv run --python ${{ matrix.python }} --locked ruff format --check .
      - run: uv run --python ${{ matrix.python }} --locked ty check
      - run: uv build --python ${{ matrix.python }}
      - name: Install wheel in clean environment
        run: |
          uv venv --python ${{ matrix.python }} /tmp/pkdb-wheel
          uv pip install --python /tmp/pkdb-wheel/bin/python dist/*.whl
          cd /tmp
          /tmp/pkdb-wheel/bin/python -c 'import pkdb, numpy, scipy, pandas, pint; from pkdb_analysis.pk import pharmacokinetics'
      - name: Build pinned runtime image
        run: docker build --build-arg PYTHON_VERSION=${{ matrix.python }} -t pkdb-next:py${{ matrix.python }} .
      - name: Verify installed container runtime
        env:
          PKDB_TEST_IMAGE: pkdb-next:py${{ matrix.python }}
          PKDB_TEST_IMAGE_PYTHON: ${{ matrix.python }}
        run: uv run --python ${{ matrix.python }} --locked pytest system_tests/test_runtime.py -q
      - name: Verify rebuild accounting tooling
        run: |
          cd ..
          PYTHONPATH=. backend-next/.venv/bin/python -m pytest tools/backend_migration/test_rebuild.py tools/backend_migration/test_manifest.py -q
      - name: Verify PostgreSQL and attachment restore
        env:
          PKDB_TEST_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: uv run --python ${{ matrix.python }} --locked pytest system_tests/test_restore.py -q
