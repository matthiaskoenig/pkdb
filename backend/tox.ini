[tox]
envlist = ty, py3.9

[testenv]
# use the checked-in uv.lock (via `uv sync --locked`) so tox installs the exact same
# versions as `uv run pytest`, instead of tox-uv's default `uv pip install` which
# re-resolves the dependencies ad hoc and can drift from the lock file
runner = uv-venv-lock-runner
# editable: manage.py and the settings module are used from the checkout
package = editable
extras =
    dev
passenv =
    PKDB_*
commands =
    pytest {posargs}

[testenv:ty]
passenv =
    TY_OUTPUT_FORMAT
extras =
    dev
commands =
    ty check
