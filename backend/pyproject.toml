[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pkdb"
dynamic = ["version"]
description = "PK-DB backend."
readme = "README.md"
requires-python = ">=3.9"
authors = [
	{name="Matthias König", email="konigmatt@googlemail.com"},
    {name="Jan Grzegorzewski"}
]
maintainers = [
	{name="Matthias König", email="konigmatt@googlemail.com"}
]
classifiers = [
	"Development Status :: 4 - Beta",
	"Intended Audience :: Science/Research",
	"Operating System :: OS Independent",
    "Programming Language :: Python :: 3.13",
	"Programming Language :: Python :: Implementation :: CPython",
	"Topic :: Scientific/Engineering",
	"Topic :: Scientific/Engineering :: Bio-Informatics",
]
keywords = [
	"pharmacokinetics",
]
dependencies = [
    "Markdown>=3.9",
    "gunicorn>=23.0.0",
    "json-logging>=1.5.1",
    "psycopg2-binary>=2.9.10",

    # django
    "Django==4.2.25",
    "django-model-utils==4.2.0",
    "django-extra-fields==3.0.2",
    "django-storages==1.12.3",
    "django-filter==21.1",
    "django-cors-headers==3.11.0",
    "django-rest-email-auth==3.0.3",

    # REST API
    "djangorestframework==3.12.4",
    "drf-yasg==1.21.4",
    "elasticsearch-dsl==7.3.0",
    "django-elasticsearch-dsl==7.2.0",
    "django-elasticsearch-dsl-drf==0.22.5",

    # analysis
    "pandas>=2.3.3",
    "numpy>=2.0.2",
    "scipy>=1.13.1",
    "matplotlib>=3.6.3",
    "pint>=0.24.4",
    "pkdb-analysis @ git+https://github.com/matthiaskoenig/pkdb_analysis.git@6e010ca987bc43995da99b826064581bf201e731"
]

[project.optional-dependencies]
dev = [
    "ipdb>=0.12.3",
    "ipython>=7.11.1",
    "flake8>=3.7.9",
    "mock==2.0.0",
    "factory-boy==2.11.1",
    "django-nose>=1.4.6",
    "nose-progressive>=1.5.1",
    "coverage>=4.5.1",
]
test = [
    "tox>=4.14.2",
    "pytest>=8.1.1",
    "pytest-cov>=5.0.0",
]

[project_urls]
Homepage = "https://pk-db.com"
Repository = "https://github.com/matthiaskoenig/pkdb"
Documentation = "https://github.com/matthiaskoenig/pkdb"
Issues = "https://github.com/matthiaskoenig/pkdb/issues"

[tool.hatch.version]
path = "./pkdb_app/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["backend/pkdb_app"]

[tool.hatch.metadata]
allow-direct-references = true