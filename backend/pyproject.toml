[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[project]
name = "pkdb"
version = "0.10.1"
description = "PK-DB backend"
requires-python = ">=3.14,<3.15"
dependencies = [
  "pydantic>=2.13.5,<3",
  "pydantic-settings>=2.15.0,<3",
  "pandas>=3.0.6,<4",
  "numpy>=2.5.3,<3",
  "scipy>=1.18.1,<2",
  "pint>=0.26.1,<1",
  "openpyxl>=3.1.5,<4",
  "pkpdutils>=1.2.0,<2",
  "sqlalchemy>=2.0.54,<3",
  "psycopg[binary]>=3.3.6,<4",
  "alembic>=1.20.0,<2",
  "pwdlib[argon2]>=0.3.1,<1",
  "fastapi>=0.141.1,<1",
  "uvicorn>=0.53.0,<1",
  "python-multipart>=0.0.32",
  "fastmcp>=4.0.5,<5",
  "mcp==2.2.0",
  "httpx2>=2.13.0,<3",
  "pillow>=12.3.0,<13",
  "authlib>=1.8.0,<2",
  "pyotp>=2.10.0,<3",
  "cryptography>=50.0.1",
]

[project.scripts]
pkdb = "pkdb.cli:main"

[dependency-groups]
vocabulary = [
    "pymetadata==0.6.4",
    "python-slugify==9.1.0",
]
dev = [
    {include-group = "vocabulary"},
    "bump-my-version>=1.5.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
    "ty>=0.0.83",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pkdb"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.ty.environment]
python-version = "3.14"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = ["corpus: requires explicitly configured source corpus", "integration: PostgreSQL integration"]
